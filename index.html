<!DOCTYPE html>
<html lang="ko">

<head>
  <!-- 설명: 한글이 깨지지 않도록 설정합니다. -->
  <meta charset="UTF-8">

  <!-- 설명: 모바일 화면 대응을 위한 설정입니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">

  <title>갤러리</title>
</head>

<body>
  <!-- 실습 흐름: 갤러리는 같은 구조의 카드가 반복된다는 점을 먼저 설명합니다. -->
  <header class="=" gallery-header">
    <!-- 실습 1: 페이지 제목을 작성합니다. 예: 갤러리 -->
    <h1 class="page-title"><!-- 페이지 제목 --></h1>

    <!-- 실습 2: 갤러리 소개 문구를 작성합니다. -->
    <p class="page-desc">다양한 이미지를 카드 형태로 확인하세요.</p>
  </header>

  <main>
    <section class="gallery-section">
      <!-- 실습 3: 섹션 제목을 작성합니다. 예: 추천 이미지 -->
      <h2>추천 이미지</h2>

      <!-- 여러 개의 카드를 넣을 공간 -->
      <div class="gallery-list">
        <!-- 설명: article은 카드 하나처럼 독립적인 콘텐츠를 표현할 때 사용합니다. -->
        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://play-lh.googleusercontent.com/G1F9HbzFIiBG_ZLbKyYFsGFui_uayZS7Yodzu0X14xm97WiYZe_-B1Nr6nlrw3Mjkxly23Bxk8yKhwpFwA2prDw" 
          alt="사진 1"
          width="300px">

          <!-- 실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">KICPA</h3>

          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">한국공인회계사회</p>

         <button class="card-btn" type="button">자세히 보기</button>
        </article>

        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://img.khan.co.kr/news/2022/03/04/2022030401000653800052541.gif" 
          alt="사진 2"
          width="300px">

          <!-- 실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">금융위원회</h3>

          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">대한민국 정부</p>

         <button class="card-btn" type="button">자세히 보기</button>
        </article>

        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://www.infostockdaily.co.kr/news/photo/201808/50373_10308_3322.jpg" 
          alt="사진 3"
          width="300px">

          <!-- 실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">금융감독원</h3>

          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">금융위원회</p>

         <button class="card-btn" type="button">자세히 보기</button>
        </article>
      </div>


    </section>
  </main>

  <footer>
    <!-- 실습 8: 페이지 하단 문구를 작성합니다. -->
    <p><!-- 푸터 문구 --></p>
  </footer>

  <script src="./js/script.js"></script>
</body>

</html>
